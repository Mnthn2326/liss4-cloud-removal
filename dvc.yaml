stages:
  manifest:
    cmd: python -m cloud_removal.rice2 --dataset-root data/raw/RICE2 --output data/manifests/rice2_manifest.json
    deps:
      - src/cloud_removal/rice2.py
      - data/raw/RICE2
    outs:
      - data/manifests/rice2_manifest.json:
          cache: false

  train:
    cmd: python -m cloud_removal.train_rice2 --config configs/train_rice2_compact_unet.yaml
    deps:
      - configs/train_rice2_compact_unet.yaml
      - data/manifests/rice2_manifest.json
      - src/cloud_removal/train_rice2.py
      - src/cloud_removal/models/unet.py
      - src/cloud_removal/metrics.py
    params:
      - configs/train_rice2_compact_unet.yaml:
          - model
          - training
          - dataset
    outs:
      - checkpoints/rice2/best_rice2_compact_unet.pt

  evaluate:
    cmd: python -m cloud_removal.evaluate_rice2 --checkpoint checkpoints/rice2/best_rice2_compact_unet.pt --manifest data/manifests/rice2_manifest.json --split test --output reports/rice2_test_metrics.json
    deps:
      - checkpoints/rice2/best_rice2_compact_unet.pt
      - data/manifests/rice2_manifest.json
      - src/cloud_removal/evaluate_rice2.py
      - src/cloud_removal/metrics.py
    metrics:
      - reports/rice2_test_metrics.json:
          cache: false

  report:
    cmd: python scripts/generate_rice2_report.py
    deps:
      - reports/rice2_test_metrics.json
      - scripts/generate_rice2_report.py
    outs:
      - reports/figures/rice2_benchmark_sample.png:
          cache: false
      - reports/rice2_benchmark_report.md:
          cache: false
